name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Gokulkrishnajayan
          outputs: |
            /tmp/snake/github-snake.svg
            /tmp/snake/github-snake-dark.svg?palette=github-dark

      - name: Update output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            --branch output \
            --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/output-branch

          cp /tmp/snake/github-snake.svg \
            /tmp/output-branch/github-snake.svg

          cp /tmp/snake/github-snake-dark.svg \
            /tmp/output-branch/github-snake-dark.svg

          cd /tmp/output-branch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-snake.svg github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "No snake changes."
            exit 0
          fi

          git commit -m "chore: update contribution snake"

          git push origin output
