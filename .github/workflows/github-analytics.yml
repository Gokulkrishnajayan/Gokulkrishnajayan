name: Generate GitHub Analytics

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Gokulkrishnajayan
        run: |
          python3 analytics/generate_analytics.py

      - name: Publish analytics to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/github-stats.svg output/top-languages.svg

          if git diff --cached --quiet; then
            echo "No analytics changes."
            exit 0
          fi

          git commit -m "chore: update GitHub analytics"

          git push origin HEAD:main

          git branch -f output
          git push origin output --force
