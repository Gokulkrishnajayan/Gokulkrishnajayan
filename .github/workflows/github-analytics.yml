name: Generate GitHub Analytics

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Gokulkrishnajayan
        run: |
          python3 analytics/generate_analytics.py

      - name: Publish analytics to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Preparing output branch..."

          # Save generated analytics files temporarily
          mkdir -p /tmp/github-analytics

          cp output/github-stats.svg /tmp/github-analytics/github-stats.svg
          cp output/top-languages.svg /tmp/github-analytics/top-languages.svg

          # Clone the existing output branch
          git clone \
            --branch output \
            --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/output-branch

          # Copy the new analytics files into the ROOT
          # of the output branch
          cp /tmp/github-analytics/github-stats.svg /tmp/output-branch/github-stats.svg
          cp /tmp/github-analytics/top-languages.svg /tmp/output-branch/top-languages.svg

          cd /tmp/output-branch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-stats.svg top-languages.svg

          if git diff --cached --quiet; then
            echo "No analytics changes."
            exit 0
          fi

          git commit -m "chore: update GitHub analytics"

          git push origin output
```
